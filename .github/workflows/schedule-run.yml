name: Schedule Run

on:
  schedule:
    # GitHub cron uses UTC. 22:05 UTC = 06:05 Asia/Taipei; the bot waits until noon.
    - cron: '5 22 * * *'
  workflow_dispatch: # 保留手動觸發按鈕方便隨時測試

jobs:
  scheduled-job:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv
          python -m pipenv install requests playwright

      - name: Install Playwright Browsers
        run: |
          python -m pipenv run playwright install --with-deps chromium

      - name: Run DinkUp Bot Schedule
        env:
          AUTH_JSON_CONTENT: ${{ secrets.AUTH_JSON_CONTENT }}
          PYTHONUNBUFFERED: "1"
          TZ: "Asia/Taipei"
          TARGET_DAY_OFFSETS: ${{ vars.TARGET_DAY_OFFSETS || '5,6' }}
        run: |
          python -m pipenv run python dinkup_bot.py
